name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (best-effort)
        run: |
          set -e
          XCODE_CANDIDATES=(
            "/Applications/Xcode_15.4.app/Contents/Developer"
            "/Applications/Xcode_15.3.app/Contents/Developer"
            "/Applications/Xcode_15.2.app/Contents/Developer"
            "/Applications/Xcode.app/Contents/Developer"
          )
          for DEVELOPER in "${XCODE_CANDIDATES[@]}"; do
            if [ -d "$DEVELOPER" ]; then
              sudo xcode-select -s "$DEVELOPER"
              break
            fi
          done
          xcodebuild -version

      - name: Compute version from tag
        id: vars
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VER"

      - name: Build app and artifacts
        run: |
          chmod +x scripts/release.sh
          ./scripts/release.sh "${{ steps.vars.outputs.version }}"

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: MacAutoBackground v${{ steps.vars.outputs.version }}
          generate_release_notes: true
          files: |
            dist/MacAutoBackground_v${{ steps.vars.outputs.version }}.dmg
            dist/MacAutoBackground_v${{ steps.vars.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
